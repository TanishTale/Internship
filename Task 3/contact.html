<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | My Multi-Page Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Shared Navigation -->
    <!-- Update your nav-links in all HTML files to look like this -->
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="submissions.html">Submissions</a></li>
    </ul>

    <!-- Contact Form Section -->
    <section class="content-section">
        <div class="container form-container">
            <h2>Get In Touch</h2>
            <p>Fill out the form below and we will get back to you shortly.</p>
            
            <!-- Notice we don't have an action="" attribute yet, JS will handle it -->
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                    <small class="error-msg" id="nameError"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="text" id="email" placeholder="Enter your email">
                    <small class="error-msg" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" placeholder="How can we help you?"></textarea>
                    <small class="error-msg" id="messageError"></small>
                </div>

                <button type="submit" class="btn">Send Message</button>
                <div id="successMessage" class="success-msg"></div>
            </form>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 BrandName. All rights reserved.</p>
    </footer>

    <!-- Link the JavaScript file ONLY where it's needed (or put it on all pages, it's built to be safe) -->
    <script src="script.js"></script>
</body>
</html>
